# pdf-creator.properties
# =============================================================================
# PdfCreator tool configuration
#
# Place this file in one of these locations (checked in order):
#   1. Same directory as pdf-creator.jar  ← recommended
#   2. Current working directory when running the JAR
#   3. Path specified by --tool-config <path> on the CLI
#   4. Path specified by PDFCREATOR_CONFIG environment variable
#
# You can also pass the file path explicitly:
#   java -jar pdf-creator.jar --html-to-pdf --input page.html --output page.pdf \
#        --tool-config /path/to/pdf-creator.properties
# =============================================================================


# -----------------------------------------------------------------------------
# wkhtmltopdf binary path
#
# Required for --html-to-pdf mode.
# If not set here, the tool falls back to:
#   1. WKHTMLTOPDF_PATH environment variable
#   2. "wkhtmltopdf" on the system PATH
#
# Use forward slashes on all platforms — Java accepts them on Windows too.
# -----------------------------------------------------------------------------

# Windows (typical installation path):
# wkhtmltopdf.path = C:/Program Files/wkhtmltopdf/bin/wkhtmltopdf.exe

# Windows (custom installation):
# wkhtmltopdf.path = D:/tools/wkhtmltopdf/bin/wkhtmltopdf.exe

# Linux (if not on PATH):
# wkhtmltopdf.path = /usr/bin/wkhtmltopdf

# macOS (Homebrew):
# wkhtmltopdf.path = /usr/local/bin/wkhtmltopdf

# macOS (Apple Silicon / Homebrew):
# wkhtmltopdf.path = /opt/homebrew/bin/wkhtmltopdf

# Uncomment and edit ONE line for your platform:
# wkhtmltopdf.path =
